name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  lint-go:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: apps/server

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Validate Compose files
        run: |
          docker compose -f compose.yml config
          docker compose -f compose.dev.yml config
      - name: Build development image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: server-runtime
          push: false
          tags: velora-dev:ci
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,mode=max,scope=dev-image
      - name: Build image (smoke test, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: velora:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and probe /api/health
        run: |
          docker run -d --rm --name velora-ci -p 8080:8080 \
            -v "$(mktemp -d):/config" \
            -v "$(mktemp -d):/cache" \
            -v "$(mktemp -d):/media" \
            velora:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/dev/null; then
              echo "health ok"
              docker stop velora-ci
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy"
          docker logs velora-ci || true
          docker stop velora-ci || true
          exit 1
