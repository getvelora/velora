name: Feature request
description: Suggest a concrete new feature or enhancement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas or design discussions, please use [Discussions](https://github.com/getvelora/velora/discussions) instead. This form is for concrete, scoped feature requests.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-facing problem does this solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Velora do? Be as concrete as you can — API shape, UI behavior, config keys.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you ruled them out.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope (tick all that apply)
      options:
        - label: Server (Go)
        - label: Web client
        - label: Container / deployment
        - label: Documentation

  - type: checkboxes
    id: confirm
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
