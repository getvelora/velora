services:
  velora:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-runtime
    environment:
      PORT: "8080"
      WEB_DIST_DIR: /app/web
      VELORA_CONFIG_DIR: /config
      VELORA_CACHE_DIR: /cache
      VELORA_MEDIA_DIR: /media
      VELORA_DATABASE_DRIVER: ${VELORA_DATABASE_DRIVER:-sqlite}
      VELORA_DATABASE_URL: ${VELORA_DATABASE_URL:-/config/velora.db}
    ports:
      - "${VELORA_HTTP_PORT:-8080}:8080"
    volumes:
      - ${VELORA_HOST_MEDIA_DIR:-./dev/media}:/media
      - ${VELORA_HOST_CACHE_DIR:-./dev/cache}:/cache
      - ${VELORA_HOST_CONFIG_DIR:-./dev/config}:/config
      - ./apps/web/dist:/app/web:ro

  web-build:
    image: node:26-alpine
    profiles:
      - tools
    working_dir: /workspace
    environment:
      VELORA_HOST_UID: ${VELORA_HOST_UID:-1000}
      VELORA_HOST_GID: ${VELORA_HOST_GID:-1000}
    volumes:
      - ./apps/web:/workspace
      - web-node-modules:/workspace/node_modules
      - web-npm-cache:/root/.npm
    command:
      - sh
      - -c
      - >-
        npm install --prefer-offline --no-audit --no-fund &&
        npm run build &&
        chown -R "$${VELORA_HOST_UID}:$${VELORA_HOST_GID}" /workspace/dist

  postgres:
    image: postgres:18-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velora}
      POSTGRES_USER: ${POSTGRES_USER:-velora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velora}
    volumes:
      - postgres-18-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora -d velora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-18-data:
  web-node-modules:
  web-npm-cache:
